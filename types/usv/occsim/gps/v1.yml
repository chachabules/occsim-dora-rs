# OccSim（无人艇仿真）GPS 传感器协议。
#
# URN 规则：types/<prefix>/vN.yml → <prefix>/vN/<TypeName>
# 本文件即 types/usv/occsim/gps/v1.yml，因此 URN 为 usv/occsim/gps/v1/GpsFix。
#
# 字段与 src/encode.rs 中的 StructArray 构造必须逐字段一致（名称、Arrow 类型、可空性），
# 由 encode::tests::custom_kinds_match_declared_schema 守护。
# 可用类型：Boolean / Int8..64 / UInt8..64 / Float32 / Float64 / Utf8 / LargeBinary / Struct / List<T>
types:
  GpsFix:
    arrow: Struct
    description: "GPS 定位：经纬高、速度（世界 NED，m/s）、定位质量与帧序号"
    fields:
      - name: fix
        type: Utf8
      - name: latitude
        type: Float64
      - name: longitude
        type: Float64
      - name: altitude
        type: Float64
      - name: vx
        type: Float64
      - name: vy
        type: Float64
      - name: vz
        type: Float64
      - name: quality
        type: Utf8
      - name: frameId
        type: Utf8
      - name: sequence
        type: UInt64
      - name: captureTime
        type: Float64
