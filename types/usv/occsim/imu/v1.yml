# OccSim（无人艇仿真）IMU 传感器协议。
#
# URN 规则：types/<prefix>/vN.yml → <prefix>/vN/<TypeName>
# 本文件即 types/usv/occsim/imu/v1.yml，因此 URN 为 usv/occsim/imu/v1/ImuSample。
#
# 字段与 src/encode.rs 中的 StructArray 构造必须逐字段一致（名称、Arrow 类型、可空性），
# 由 encode::tests::custom_kinds_match_declared_schema 守护。
# 可用类型：Boolean / Int8..64 / UInt8..64 / Float32 / Float64 / Utf8 / LargeBinary / Struct / List<T>
types:
  ImuSample:
    arrow: Struct
    description: "IMU 比力（m/s²，艇体 FRD）、角速度（rad/s）、来源与帧序号"
    fields:
      - name: fx
        type: Float64
      - name: fy
        type: Float64
      - name: fz
        type: Float64
      - name: wx
        type: Float64
      - name: wy
        type: Float64
      - name: wz
        type: Float64
      - name: quality
        type: Utf8
      - name: source
        type: Utf8
      - name: sequence
        type: UInt64
      - name: captureTime
        type: Float64
