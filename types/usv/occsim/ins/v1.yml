# OccSim（无人艇仿真）组合导航传感器协议。
#
# URN 规则：types/<prefix>/vN.yml → <prefix>/vN/<TypeName>
# 本文件即 types/usv/occsim/ins/v1.yml，因此 URN 为 usv/occsim/ins/v1/InsState。
#
# 字段与 src/encode.rs 中的 StructArray 构造必须逐字段一致（名称、Arrow 类型、可空性），
# 由 encode::tests::custom_kinds_match_declared_schema 守护。
# 可用类型：Boolean / Int8..64 / UInt8..64 / Float32 / Float64 / Utf8 / LargeBinary / Struct / List<T>
types:
  InsState:
    arrow: Struct
    description: "组合导航解算：NED 位置（m）、速度（m/s）、姿态（rad）、滤波器状态"
    fields:
      - name: px
        type: Float64
      - name: py
        type: Float64
      - name: pz
        type: Float64
      - name: vx
        type: Float64
      - name: vy
        type: Float64
      - name: vz
        type: Float64
      - name: heading
        type: Float64
      - name: filter
        type: Utf8
      - name: roll
        type: Float64
      - name: pitch
        type: Float64
      - name: quality
        type: Utf8
      - name: mode
        type: Utf8
      - name: rejectedUpdates
        type: UInt64
      - name: innovation
        type: Float64
      - name: sequence
        type: UInt64
      - name: captureTime
        type: Float64
